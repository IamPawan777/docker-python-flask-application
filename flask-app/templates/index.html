<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 1rem; }
        p { font-size: 1.1rem; color: #94a3b8; margin-bottom: 2rem; }
        .badge { display: inline-block; background: #1e293b; border: 1px solid #334155; padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.85rem; margin: 0.3rem; color: #7dd3fc; }
        .btn { display: inline-block; background: #0284c7; color: white; padding: 0.6rem 1.4rem; border-radius: 8px; text-decoration: none; margin-top: 1.5rem; cursor: pointer; border: none; font-size: 1rem; }
        .btn:hover { background: #0369a1; }
        #result { margin-top: 1.5rem; background: #1e293b; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.9rem; color: #4ade80; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Flask App</h1>
        <p>Your Python Flask application is running successfully.</p>
        <div>
            <span class="badge">Python 3.11</span>
            <span class="badge">Flask 3.x</span>
            <span class="badge">Docker Ready</span>
            <span class="badge">GitHub Ready</span>
        </div>
        <br>
        <button class="btn" onclick="testApi()">Test API</button>
        <div id="result"></div>
    </div>
    <script>
        async function testApi() {
            const res = await fetch('/api/hello');
            const data = await res.json();
            const el = document.getElementById('result');
            el.style.display = 'block';
            el.textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
